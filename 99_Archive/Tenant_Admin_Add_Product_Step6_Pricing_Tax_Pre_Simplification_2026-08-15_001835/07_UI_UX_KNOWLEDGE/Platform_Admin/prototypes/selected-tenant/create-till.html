<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ST-03 — Create Initial Till</title>
  <link rel="stylesheet" href="prototype.css" />
</head>
<body>
  <div class="proto-toolbar"><strong>ST-03 Create Till</strong><a class="btn" href="setup-hub.html">Hub</a></div>
  <div class="viewport-frame w-1280">
    <div class="app-shell">
      <aside class="sidebar"><div class="brand">OneVerz</div><nav><a href="#" class="active">Tenants</a></nav></aside>
      <div class="main">
        <div class="topbar">Platform Admin</div>
        <div class="page">
          <nav class="breadcrumb"><a href="setup-hub.html">Configure</a> / Create Till</nav>
          <h1 class="page-title">Create Initial Till</h1>
          <div class="tenant-context" role="region" aria-label="Selected tenant context">
            <div class="identity"><div class="name">ABC Retail</div><div class="meta"><span class="chip chip-code">TEN-ABC-001</span></div></div>
            <a href="setup-hub.html" class="btn btn-secondary btn-sm">Exit Tenant Context</a>
          </div>
          <form class="form-card" onsubmit="return false;">
            <div class="field">
              <label>Outlet *</label>
              <select><option>Main Store (OUT-2026-0007)</option></select>
              <p class="hint">Till must belong to an active outlet</p>
            </div>
            <div class="field"><label>Till Name *</label><input type="text" placeholder="Front Counter" /></div>
            <div class="field">
              <label>Till Code *</label>
              <input type="text" placeholder="TILL-01" />
              <p class="hint">Unique within tenant/outlet</p>
            </div>
            <div class="alert alert-warning" style="margin-top:0;">Device binding is performed by Tenant Admin after handoff — not in bootstrap scope.</div>
            <div class="form-footer">
              <a href="setup-hub.html" class="btn btn-secondary">Cancel</a>
              <button class="btn btn-primary">Save Till</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
