<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ST-05 — Add Additional User</title>
  <link rel="stylesheet" href="prototype.css" />
</head>
<body>
  <div class="proto-toolbar"><strong>ST-05 Add User</strong><a class="btn" href="setup-hub.html">Hub</a></div>
  <div class="viewport-frame w-1280">
    <div class="app-shell">
      <aside class="sidebar"><div class="brand">OneVerz</div><nav><a href="#" class="active">Tenants</a></nav></aside>
      <div class="main">
        <div class="topbar">Platform Admin</div>
        <div class="page">
          <nav class="breadcrumb"><a href="setup-hub.html">Configure</a> / Add User</nav>
          <h1 class="page-title">Add Additional Tenant User</h1>
          <p class="page-desc">First Tenant Admin was created in the tenant wizard — use this for additional staff only.</p>
          <div class="tenant-context" role="region" aria-label="Selected tenant context">
            <div class="identity"><div class="name">ABC Retail</div></div>
            <a href="setup-hub.html" class="btn btn-secondary btn-sm">Exit Tenant Context</a>
          </div>
          <form class="form-card" onsubmit="return false;">
            <div class="field"><label>Full Name *</label><input type="text" /></div>
            <div class="field-row">
              <div class="field"><label>Email *</label><input type="email" /></div>
              <div class="field"><label>Phone</label><input type="tel" /></div>
            </div>
            <div class="field">
              <label>Role *</label>
              <select><option>Tenant Admin (bootstrap)</option><option>Store Manager</option></select>
            </div>
            <div class="field">
              <label>Outlet Access</label>
              <select multiple style="min-height:80px;"><option>Main Store</option></select>
              <p class="hint">Optional outlet scope for this user</p>
            </div>
            <div class="form-footer">
              <a href="setup-hub.html" class="btn btn-secondary">Cancel</a>
              <button class="btn btn-primary">Save &amp; Send Invite</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
